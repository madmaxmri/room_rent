<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} - RoomRent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
  </head>
  <body class="admin-login-body">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack" aria-live="polite">
          {% for category, message in messages %}
            <p class="flash flash-{{ category }}">{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <main>
      <section class="auth-page admin-auth-page">
        <div class="auth-panel">
          <p class="eyebrow">OTP</p>
          <h1>{{ heading }}</h1>

          {% if demo_otp %}
            <div class="otp-demo">
              <span>Demo OTP</span>
              <strong>{{ demo_otp }}</strong>
            </div>
          {% endif %}

          <form method="post" action="{{ form_action }}" class="auth-form">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <label>
              <span>OTP code</span>
              <input type="text" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
            </label>
            <button type="submit">Verify</button>
          </form>

          <div class="auth-links">
            <a href="{{ back_url }}">Start again</a>
          </div>
        </div>
        <div class="auth-visual" aria-hidden="true"></div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/admin.js') }}" defer></script>
  </body>
</html>

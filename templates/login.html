{% extends "base.html" %}

{% block title %}Login - RoomRent{% endblock %}

{% block content %}
  <section class="auth-page">
    <div class="auth-panel">
      <p class="eyebrow">Login</p>
      <h1>Access RoomRent</h1>

      <form method="post" class="auth-form">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label>
          <span>Phone number</span>
          <input type="tel" name="phone" placeholder="+91 98765 43210" required>
        </label>
        <button type="submit">Send OTP</button>
      </form>

      <div class="auth-divider"><span>or</span></div>

      {% if google_oauth_enabled %}
        <a class="button-secondary auth-google" href="{{ url_for('google_login', next=next_url) }}">Continue with Google</a>
      {% else %}
        <p class="auth-note">Google sign-in needs OAuth credentials in `.env`.</p>
      {% endif %}

      <p class="auth-switch">
        New to RoomRent?
        <a href="{{ url_for('signup', next=next_url) }}">Create an account</a>
      </p>
    </div>
    <div class="auth-visual" aria-hidden="true"></div>
  </section>
{% endblock %}

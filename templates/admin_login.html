<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login - RoomRent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
  </head>
  <body class="admin-login-body">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack" aria-live="polite">
          {% for category, message in messages %}
            <p class="flash flash-{{ category }}">{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <main>
      <section class="auth-page admin-auth-page">
        <div class="auth-panel">
          <p class="eyebrow">Admin</p>
          <h1>Admin login</h1>

          <form method="post" class="auth-form">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <label>
              <span>Admin ID</span>
              <input type="text" name="admin_id" autocomplete="username" required>
            </label>
            <label>
              <span>Password</span>
              <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit">Sign in</button>
          </form>

          <div class="auth-links">
            <a href="{{ admin_signup_url }}">Create admin account</a>
            <a href="{{ admin_reset_url }}">Reset password</a>
          </div>

          <p class="auth-note">
            Database: {{ admin_storage_label }}
          </p>
        </div>
        <div class="auth-visual admin-auth-visual" aria-hidden="true"></div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/admin.js') }}" defer></script>
  </body>
</html>
